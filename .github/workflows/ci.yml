name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Core on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package and dependencies (Core)
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[viz]"
        pip install pytest wheel pandas matplotlib

    - name: Test CLI entry points
      run: |
        doom --help
        doom check examples/todo_app.doom

    - name: Run Pytest test suite (Core)
      env:
        MPLBACKEND: Agg
      run: |
        python -m pytest -v --tb=short

    - name: Capture and annotate test failures
      if: failure()
      run: |
        python -m pytest --last-failed -v --tb=long > failures.txt 2>&1 || true
        cat failures.txt
        python -c "
        import re
        try:
            content = open('failures.txt', encoding='utf-8', errors='ignore').read()
            for line in content.splitlines():
                if line.startswith('FAILED ') or line.startswith('E   '):
                    safe = line.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                    print(f'::error::{safe}')
        except Exception as e:
            print(f'::error::Failed to parse failures: {e}')
        "

    - name: Run English Corpus Benchmark
      run: |
        python run_corpus.py --fail-under 95

  test-viz:
    name: Viz on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package with visualization dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[viz]"
        pip install pytest wheel

    - name: Run Visualization Test Suite
      env:
        MPLBACKEND: Agg
      run: |
        python -m pytest -v tests/viz/

    - name: Run Visualization Capability Benchmark
      env:
        MPLBACKEND: Agg
      run: |
        python run_viz_capability.py
