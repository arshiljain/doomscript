name: DoomScript coding-session experience

on:
  push:
    branches:
      - experience/coding-session-20261023

jobs:
  experience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install DoomScript and optional dependencies
        run: |
          python -m pip install -e .
      - name: Validate sample programs
        run: |
          doom check experience_samples/sales_report.doom
          doom check experience_samples/fibonacci.doom
      - name: Run sales report and recursive algorithm
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from doomscript.compiler.engine import execute

          sales_path = Path("experience_samples/sales_report.doom")
          source = sales_path.read_text(encoding="utf-8")
          env = execute(source)

          expected_names = ["Asha", "Dev", "Ira"]
          actual_names = [row["customer"] for row in env["qualified_orders"]]
          assert actual_names == expected_names, (actual_names, expected_names)
          assert env["qualified_count"] == 3, env["qualified_count"]
          assert float(env["qualified_revenue"]) == 274.0, env["qualified_revenue"]
          assert env["top_customer"] == "Asha", env["top_customer"]

          output_path = Path("experience_samples/clean_report.csv")
          assert output_path.exists(), "DoomScript did not write the requested CSV"
          with output_path.open(newline="", encoding="utf-8") as f:
              exported = list(csv.DictReader(f))
          assert [r["customer"] for r in exported] == expected_names, exported
          assert [float(r["amount"]) for r in exported] == [120.0, 99.0, 55.0], exported

          print("PASS sales_report.doom")
          print(f"  selected customers: {actual_names}")
          print(f"  count={env['qualified_count']}, revenue={env['qualified_revenue']}, top={env['top_customer']}")
          print(f"  exported CSV rows: {len(exported)}; descending sort verified")

          fib_source = Path("experience_samples/fibonacci.doom").read_text(encoding="utf-8")
          fib_env = execute(fib_source)
          assert fib_env["result"] == 55, fib_env.get("result")
          print("PASS fibonacci.doom")
          print(f"  Fibonacci(10) = {fib_env['result']}")

          # Test a nested English transformation independently, rather than only trusting files.
          nested = execute('set words to ["  red ", "blue"]\nset label to uppercase of first item of words\nset cleaned to trim of label')
          assert nested["cleaned"] == "RED", nested.get("cleaned")
          print("PASS nested expression composition: trim of uppercase of first item")

          print("\nEXPERIENCE RUN SUMMARY: 3/3 program checks passed")
          PY
