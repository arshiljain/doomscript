[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doomscript"
version = "1.0.0"
description = "An English-first programming language that compiles to Python AST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
doom = "doomscript.cli:app"
