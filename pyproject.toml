[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doomscript"
version = "1.2.0"
description = "An English-first programming language that compiles to Python AST"
readme = "README.md"
authors = [
    { name = "DoomScript Team" },
]
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "lark>=1.1.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
data = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
]
viz = [
    "lets-plot>=4.5.0",
    "pypng>=0.20220715.0",
    "palettable>=3.3.3",
]
nlp = [
    "scikit-learn",
]
geo = [
    "shapely>=2.0.0",
]
opt = [
    "scipy>=1.10.0",
]
all = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "lets-plot>=4.5.0",
    "pypng>=0.20220715.0",
    "palettable>=3.3.3",
    "shapely>=2.0.0",
    "scipy>=1.10.0",
]


[project.urls]
Homepage = "https://github.com/doomscript/doomscript"
Repository = "https://github.com/doomscript/doomscript"
Documentation = "https://github.com/doomscript/doomscript#readme"

[project.scripts]
doom = "doomscript.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"doomscript" = ["grammar/*.lark", "**/*.lark"]
"doomscript.grammar" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]

